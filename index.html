<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="https://assets.pokemon.com/static2/_ui/img/favicon.ico"
      type="image/x-icon"
    />
    <title>Pokemon Informations</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <!-- Left side of the card -->
        <div class="subcard1">
          <img src="images/logo.png" alt="No image" class="pokemonLogo" />
          <h2 class="pokemon-gen">POKEMON GEN I</h2>
          <h1 class="pokemon-name">Pikachu</h1>
          <p class="pokemon-desc">
            Pikachu is an Electric-type Pokémon introduced in Generation
            I.Pikachu are small, chubby, and incredibly cute mouse-like Pokémon.
            They are almost completely covered by yellow fur.
          </p>
          <div class="page-number">
            <hr class="line" />
            01/05
          </div>
          <img src="images/ball.png" alt="ball img not found" class="ball" />
        </div>
        <!-- Right side of the card -->
        <div class="subcard2">
          <img src="images/menu.png" alt="no menu" class="menu" />
          <img src="images/pickachu.png" alt="no pickachu" class="pikachu" />
          <div class="dots">
            <div class="dot dot1"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
